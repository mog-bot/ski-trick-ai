<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Ski Trick AI</title>
  <style>
    body{margin:0;background:#f5f5f7;color:#1d1d1f;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;display:grid;place-items:center;min-height:100vh}
    .loader{text-align:center;padding:32px}.loader strong{font-size:1.25rem}.loader p{color:#6e6e73}
  </style>
</head>
<body>
  <div class="loader"><strong>Loading Ski Trick AI…</strong><p id="status">Preparing line analysis.</p></div>
  <script>
    (async()=>{
      try{
        const parts=Array.from({length:8},(_,i)=>`app/part-${String(i+1).padStart(2,"0")}.txt`);
        const responses=await Promise.all(parts.map(p=>fetch(p,{cache:"no-store"})));
        const failed=responses.findIndex(r=>!r.ok);
        if(failed!==-1) throw new Error(`Could not load ${parts[failed]}`);
        let html=(await Promise.all(responses.map(r=>r.text()))).join("");

        html=html
          .replace('<h1>Ski Trick AI<br>Pose Trainer</h1>','<h1>Ski Trick AI</h1>')
          .replace(/<p class="sub">[\s\S]*?<\/p>/,'<p class="sub">Upload a ski line. The AI tracks the skier, identifies each trick, and calculates the score.</p>')
          .replace('<div class="badge">Pose + LSTM + feedback learning</div>','<div class="badge">AI line tracking + trick scoring</div>')
          .replace('<a href="#trainingCard">Train</a>','')
          .replace('<a href="#testCard">Identify</a>','')
          .replace('<a href="#scoringArea">Points</a>','');

        const publicCss=`<style>
          #trainingCard,#testCard{display:none!important}
          #scoringArea,#scoreList,.scoreGrid,#addScoreBtn,#feedbackPanel{display:none!important}
          .topnav a[href="#trainingCard"],.topnav a[href="#testCard"],.topnav a[href="#scoringArea"]{display:none!important}

          .grid{display:none!important}
          header{max-width:1180px;margin:0 auto}

          #lineAnalysisCard,#versusCard{width:100%;min-width:0}
          #versusCard .versusGrid{
            grid-template-columns:minmax(0,1fr) 46px minmax(0,1fr)!important;
            gap:24px!important;
            align-items:start;
          }
          #versusCard .competitor{min-width:0;overflow:hidden}
          #versusCard .vsMark{justify-self:center;align-self:center}
          #versusCard input[type=text],#versusCard input[type=file]{max-width:100%;min-width:0;width:100%}
          #versusCard input[type=file]{overflow:hidden;text-overflow:ellipsis}
          #versusCard .compScore{font-size:clamp(1.9rem,4vw,2.5rem)}
          #versusCard .actions{margin-top:26px}
          #winnerBox{display:none}

          #compareBtn:disabled,#analyzeLineBtn:disabled{
            opacity:.45;cursor:not-allowed;box-shadow:none!important;transform:none!important
          }

          @media(max-width:760px){
            #versusCard .versusGrid{grid-template-columns:1fr!important;gap:20px!important}
            #versusCard .vsMark{justify-self:start}
          }
        </style>`;
        html=html.replace('</head>',publicCss+'</head>');

        const publicScript=`<script>
          window.addEventListener('DOMContentLoaded',()=>{
            const cards=[...document.querySelectorAll('section.card.notice')];
            cards.forEach(card=>{
              const h=card.querySelector('h2');
              if(h && h.textContent.includes('What this version learns')) card.style.display='none';
            });

            const line=document.getElementById('lineAnalysisCard');
            const versus=document.getElementById('versusCard');
            if(line && versus && versus.parentNode){
              versus.parentNode.insertBefore(line,versus);
            }

            const lineStatus=document.getElementById('lineStatus');
            const vsStatus=document.getElementById('versusStatus');
            const compareBtn=document.getElementById('compareBtn');
            const analyzeBtn=document.getElementById('analyzeLineBtn');
            const winnerBox=document.getElementById('winnerBox');

            if(winnerBox) winnerBox.style.display='none';
            if(compareBtn) compareBtn.disabled=true;
            if(analyzeBtn) analyzeBtn.disabled=true;
            if(lineStatus) lineStatus.textContent='Loading trained Ski Trick AI model...';
            if(vsStatus) vsStatus.textContent='Loading trained Ski Trick AI model...';
          });
        <\/script>`;

        html=html.replace('</body>',publicScript+'<script src="/public-model.js?v=3"><\/script></body>');

        document.open();
        document.write(html);
        document.close();
      }catch(err){
        document.getElementById('status').textContent='The app could not load: '+err.message;
      }
    })();
  </script>
</body>
</html>
