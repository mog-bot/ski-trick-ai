<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Ski Trick AI Trainer</title>
  <style>
    body{margin:0;background:#f5f5f7;color:#1d1d1f;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;display:grid;place-items:center;min-height:100vh}
    .loader{text-align:center;padding:32px}.loader strong{font-size:1.25rem}.loader p{color:#6e6e73}
  </style>
</head>
<body>
  <div class="loader"><strong>Loading Ski Trick AI Trainer…</strong><p id="status">Preparing training tools.</p></div>
  <script>
    (async()=>{
      try{
        const parts=Array.from({length:8},(_,i)=>`app/part-${String(i+1).padStart(2,"0")}.txt`);
        const responses=await Promise.all(parts.map(p=>fetch(p,{cache:"no-store"})));
        const failed=responses.findIndex(r=>!r.ok);
        if(failed!==-1) throw new Error(`Could not load ${parts[failed]}`);
        let html=(await Promise.all(responses.map(r=>r.text()))).join("");

        const libraryCss=`<style>
          .supabaseLibrary{margin:0 0 30px;padding:0 0 28px;border-bottom:1px solid #e8e8ed}
          .supabaseGrid{display:grid;gap:0;margin-top:14px;border-top:1px solid #e8e8ed}
          .supabaseClass{display:flex;justify-content:space-between;gap:16px;padding:12px 0;border-bottom:1px solid #e8e8ed}
          .supabaseActions{display:flex;gap:18px;flex-wrap:wrap;margin-top:20px;margin-bottom:12px}
          .debugBox{margin-top:12px;padding:12px 0;color:#6e6e73;font-size:.82rem;white-space:pre-wrap;border-top:1px solid #e8e8ed}
        </style>`;
        html=html.replace('</head>',libraryCss+'</head>');

        const libraryHtml=`
          <div class="supabaseLibrary" id="supabaseLibrarySection">
            <div class="sectionEyebrow">Cloud training library</div>
            <h3>Supabase training videos</h3>
            <div class="help">Loads every trick folder from the private <strong>training videos</strong> bucket. Each folder name becomes the trick label automatically.</div>
            <div class="supabaseActions">
              <button id="loadSupabaseLibrary" type="button" class="secondary">Check Supabase library</button>
              <button id="importSupabaseLibrary" type="button" disabled>Import all into trainer</button>
              <button id="exportTrainedModel" type="button" class="secondary">Export trained AI</button>
            </div>
            <div class="status" id="supabaseLibraryStatus">Waiting to check the training library.</div>
            <div class="supabaseGrid" id="supabaseLibraryList"></div>
            <div class="debugBox" id="supabaseDebug">API endpoint: /api/training-library</div>
          </div>`;

        html=html.replace(
          '<section class="card" id="trainingCard">',
          '<section class="card" id="trainingCard">'+libraryHtml
        );

        html=html.replace('</body>','<script src="/trainer-supabase.js?v=3"><\/script></body>');

        document.open();
        document.write(html);
        document.close();
      }catch(err){
        document.getElementById('status').textContent='The trainer could not load: '+err.message;
      }
    })();
  </script>
</body>
</html>
