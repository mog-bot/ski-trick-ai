<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Ski Trick AI Trainer</title>
  <style>
    body{margin:0;background:#f5f5f7;color:#1d1d1f;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;display:grid;place-items:center;min-height:100vh}
    .loader{text-align:center;padding:32px}.loader strong{font-size:1.25rem}.loader p{color:#6e6e73}
  </style>
</head>
<body>
  <div class="loader"><strong>Loading Ski Trick AI Trainer…</strong><p id="status">Preparing training tools.</p></div>
  <script>
    (async()=>{
      try{
        const parts=Array.from({length:8},(_,i)=>`app/part-${String(i+1).padStart(2,"0")}.txt`);
        const responses=await Promise.all(parts.map(p=>fetch(p,{cache:"no-store"})));
        const failed=responses.findIndex(r=>!r.ok);
        if(failed!==-1) throw new Error(`Could not load ${parts[failed]}`);
        let html=(await Promise.all(responses.map(r=>r.text()))).join("");

        const libraryCss=`<style>
          .supabaseLibrary{margin:0 0 30px;padding:0 0 28px;border-bottom:1px solid #e8e8ed}
          .supabaseGrid{display:grid;gap:0;margin-top:14px;border-top:1px solid #e8e8ed}
          .supabaseClass{display:flex;justify-content:space-between;gap:16px;padding:12px 0;border-bottom:1px solid #e8e8ed}
          .supabaseActions{display:flex;gap:18px;flex-wrap:wrap;margin-top:20px;margin-bottom:12px}
          .debugBox{margin-top:12px;padding:12px 0;color:#6e6e73;font-size:.82rem;white-space:pre-wrap;border-top:1px solid #e8e8ed}
        </style>`;
        html=html.replace('</head>',libraryCss+'</head>');

        const libraryHtml=`
          <div class="supabaseLibrary" id="supabaseLibrarySection">
            <div class="sectionEyebrow">Cloud training library</div>
            <h3>Supabase training videos</h3>
            <div class="help">Loads every trick folder from the private <strong>training videos</strong> bucket. Each folder name becomes the trick label automatically.</div>
            <div class="supabaseActions">
              <button id="loadSupabaseLibrary" type="button" class="secondary">Check Supabase library</button>
              <button id="importSupabaseLibrary" type="button" disabled>Import all into trainer</button>
              <button id="exportTrainedModel" type="button" class="secondary">Export trained AI</button>
            </div>
            <div class="status" id="supabaseLibraryStatus">Waiting to check the training library.</div>
            <div class="supabaseGrid" id="supabaseLibraryList"></div>
            <div class="debugBox" id="supabaseDebug">API endpoint: /api/training-library</div>
          </div>`;

        html=html.replace(
          '<section class="card" id="trainingCard">',
          '<section class="card" id="trainingCard">'+libraryHtml
        );

        const libraryScript=`<script>
          (()=>{
            const status=document.getElementById('supabaseLibraryStatus');
            const list=document.getElementById('supabaseLibraryList');
            const importBtn=document.getElementById('importSupabaseLibrary');
            const debug=document.getElementById('supabaseDebug');
            const loadBtn=document.getElementById('loadSupabaseLibrary');
            const exportBtn=document.getElementById('exportTrainedModel');
            let library=null;

            if(!status || !list || !importBtn || !loadBtn){
              console.error('Supabase trainer controls were not rendered.');
              return;
            }

            async function loadLibrary(){
              status.textContent='Connecting to the private Supabase training library…';
              debug.textContent='Calling /api/training-library…';
              importBtn.disabled=true;
              loadBtn.disabled=true;
              list.innerHTML='';

              const controller=new AbortController();
              const timer=setTimeout(()=>controller.abort(),12000);
              try{
                const response=await fetch('/api/training-library?ts='+Date.now(),{
                  cache:'no-store',
                  signal:controller.signal,
                  headers:{accept:'application/json'}
                });
                const raw=await response.text();
                let data={};
                try{ data=raw?JSON.parse(raw):{}; }
                catch(_){ throw new Error('API returned non-JSON output (HTTP '+response.status+'). '+raw.slice(0,180)); }
                if(!response.ok) throw new Error(data.error || ('API returned HTTP '+response.status));

                library=data;
                status.textContent='Connected. Found '+data.videoCount+' videos across '+data.classCount+' trick folders.';
                debug.textContent='Connection successful. Bucket: '+(data.bucket || 'training videos');
                list.innerHTML=(data.classes||[]).map(item=>
                  '<div class="supabaseClass"><strong>'+item.label+'</strong><span>'+item.videos.length+' videos</span></div>'
                ).join('');
                importBtn.disabled=!data.videoCount;
              }catch(err){
                const message=err && err.name==='AbortError'
                  ? 'The Vercel API did not answer within 12 seconds. Check the latest Production deployment and environment variables.'
                  : (err.message || String(err));
                status.textContent='Supabase connection error: '+message;
                debug.textContent='Diagnostic: '+message+'\nOpen /api/training-library in a new tab to inspect the raw response.';
              }finally{
                clearTimeout(timer);
                loadBtn.disabled=false;
              }
            }

            loadBtn.addEventListener('click',loadLibrary);

            importBtn.addEventListener('click',async()=>{
              if(!library) return;
              const entries=(library.classes||[]).flatMap(group=>(group.videos||[]).map(video=>({...video,label:group.label})));
              if(typeof window.skiTrainerImportRemote!=='function'){
                status.textContent='Trainer import engine is still loading. Try again in a moment.';
                return;
              }
              importBtn.disabled=true;
              status.textContent='Importing '+entries.length+' videos. Each video is being pose-tracked locally.';
              try{
                const result=await window.skiTrainerImportRemote(entries);
                status.textContent='Imported '+result.added+' videos into the trainer. '+result.failed+' skipped. Now press Train trick model.';
              }catch(err){
                status.textContent='Import failed: '+err.message;
              }finally{
                importBtn.disabled=false;
              }
            });

            exportBtn.addEventListener('click',async()=>{
              try{
                if(typeof window.skiTrainerExportModel!=='function') throw new Error('Train the model first or wait for the trainer to finish loading.');
                status.textContent='Exporting the trained model…';
                await window.skiTrainerExportModel();
                status.textContent='Export complete. Keep the model JSON, weights file, and config file together.';
              }catch(err){
                status.textContent='Export failed: '+err.message;
              }
            });

            setTimeout(loadLibrary,500);
          })();
        <\/script>`;
        html=html.replace('</body>',libraryScript+'</body>');

        document.open();
        document.write(html);
        document.close();
      }catch(err){
        document.getElementById('status').textContent='The trainer could not load: '+err.message;
      }
    })();
  </script>
</body>
</html>
